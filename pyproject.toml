[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quaternions"
version = "0.1.0"
description = "Quaternion arithmetic and 3D rotations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tests"]
addopts = "--doctest-modules"
